name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build default variant
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: local
          load: true

      - name: Verify image runs
        run: |
          docker run --rm bun-nano:local --version
          docker run --rm bun-nano:local -e "console.log('hello from bun-nano')"

      - name: Print image size
        run: |
          SIZE=$(docker image inspect bun-nano:local --format '{{.Size}}')
          HUMAN=$(numfmt --to=iec "$SIZE")
          echo "Image size: $HUMAN ($SIZE bytes)"
          echo "### Image size: $HUMAN" >> "$GITHUB_STEP_SUMMARY"
