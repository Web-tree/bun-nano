name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Read pinned Bun version
        id: pin
        run: echo "bun_version=$(bash scripts/bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Verify upstream shipped musl assets for every architecture we publish
        env:
          BUN_VERSION: ${{ steps.pin.outputs.bun_version }}
        run: |
          set -euo pipefail
          # The release targets linux/amd64 AND linux/arm64, but the load-based
          # smoke test below can only run amd64. A missing or renamed arm64 asset
          # would therefore sail through CI and break at release time — which is
          # exactly what happened once already (commit 1a69483: bun publishes
          # 'aarch64', not 'arm64'). A 1-byte ranged GET catches it here instead.
          for arch in x64 aarch64; do
            url="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-${arch}-musl.zip"
            if curl -fsSL --range 0-0 -o /dev/null "$url"; then
              echo "ok   $arch  $url"
            else
              echo "FAIL $arch  missing asset: $url" >&2
              exit 1
            fi
          done

      - name: Build default and upx variants
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: local,local-upx
          load: true

      - name: Verify both variants run the pinned Bun
        env:
          BUN_VERSION: ${{ steps.pin.outputs.bun_version }}
        run: |
          set -euo pipefail
          # Asserting the *number*, not merely that --version exits 0. Without
          # this a wrong or stale pin produces a green build and a mislabelled
          # published tag.
          for image in bun-nano:local bun-nano:local-upx; do
            actual=$(docker run --rm "$image" --version)
            if [ "$actual" != "$BUN_VERSION" ]; then
              echo "FAIL $image reports Bun '$actual', expected '$BUN_VERSION'" >&2
              exit 1
            fi
            docker run --rm "$image" -e "console.log('hello from ' + process.versions.bun)"
            echo "ok   $image  bun $actual"
          done

      - name: Report image sizes
        run: |
          set -euo pipefail
          {
            echo "### bun-nano ${{ steps.pin.outputs.bun_version }}"
            echo ""
            echo "| Variant | Size |"
            echo "|---|---|"
            for image in bun-nano:local bun-nano:local-upx; do
              size=$(docker image inspect "$image" --format '{{.Size}}')
              echo "| \`$image\` | $(numfmt --to=iec "$size") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
