name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bun_version:
        description: "Bun version to build (e.g. 1.3.12)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Bun version and registry prefix
        id: version
        run: |
          if [ -n "${{ inputs.bun_version }}" ]; then
            echo "bun_version=${{ inputs.bun_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "bun_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "ghcr_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: default,upx
          push: true
        env:
          BUN_VERSION: ${{ steps.version.outputs.bun_version }}
          REGISTRIES: "docker.io/${{ secrets.DOCKERHUB_USERNAME }},ghcr.io/${{ steps.version.outputs.ghcr_owner }}"

      - name: Print image info
        run: |
          VERSION="${{ steps.version.outputs.bun_version }}"
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Variant |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`bun-nano:${VERSION}\` | default |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`bun-nano:${VERSION}-upx\` | UPX compressed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`bun-nano:latest\` | default |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`bun-nano:upx\` | UPX compressed |" >> "$GITHUB_STEP_SUMMARY"
