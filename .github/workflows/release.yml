name: Release

# Triggered by the version pin changing on main, NOT by a pushed tag.
#
# The old `on: push: tags` trigger is why this repo stopped publishing: the
# nightly workflow pushed tags using GITHUB_TOKEN, and GitHub deliberately does
# not start workflows from GITHUB_TOKEN pushes. Tags v1.3.13 and v1.3.14 were
# created and no image was ever built for either. Releasing from main inverts
# the order — build first, tag only after the push succeeds — so a tag can only
# exist if the images behind it exist, and no PAT is needed to make it work.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-bake.hcl"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      bun_version: ${{ steps.version.outputs.bun_version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned Bun version
        id: version
        run: echo "bun_version=$(bash scripts/bun-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Skip versions that were already released
        id: check
        env:
          BUN_VERSION: ${{ steps.version.outputs.bun_version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${BUN_VERSION}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${BUN_VERSION} already exists — nothing to publish."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Bun ${BUN_VERSION} has not been released yet."
          fi

  publish:
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve GHCR owner
        id: registry
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # This image is published to BOTH registries and the README advertises
      # both, so a missing Docker Hub credential is a release-blocking error,
      # not something to skip past. It also has to be checked before the tags
      # are computed: docker-bake.hcl splits REGISTRIES on "," and interpolates
      # each element, so an empty DOCKERHUB_USERNAME silently yields the
      # malformed tag "docker.io//bun-nano:<version>".
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${DOCKERHUB_USERNAME:-}" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "${DOCKERHUB_TOKEN:-}" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "ERROR: missing secret(s):$missing" >&2
            echo "       bun-nano publishes to docker.io/${DOCKERHUB_USERNAME:-<unset>} as well as GHCR." >&2
            echo "       Add the secret, or drop docker.io from REGISTRIES below and from README.md." >&2
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: default,upx
          push: true
        env:
          BUN_VERSION: ${{ needs.resolve.outputs.bun_version }}
          REGISTRIES: "docker.io/${{ secrets.DOCKERHUB_USERNAME }},ghcr.io/${{ steps.registry.outputs.owner }}"

      - name: Tag the released commit
        env:
          BUN_VERSION: ${{ needs.resolve.outputs.bun_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${BUN_VERSION}" -m "Bun ${BUN_VERSION}"
          git push origin "v${BUN_VERSION}"

      - name: Summarise published tags
        env:
          BUN_VERSION: ${{ needs.resolve.outputs.bun_version }}
          OWNER: ${{ steps.registry.outputs.owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          minor="${BUN_VERSION%.*}"
          major="${BUN_VERSION%%.*}"
          {
            echo "### Published to docker.io/${DOCKERHUB_USERNAME}/bun-nano and ghcr.io/${OWNER}/bun-nano"
            echo ""
            echo "| Tag | Variant |"
            echo "|---|---|"
            for t in "$BUN_VERSION" "$minor" "$major" latest; do
              echo "| \`$t\` | default |"
            done
            for t in "${BUN_VERSION}-upx" "${minor}-upx" "${major}-upx" upx; do
              echo "| \`$t\` | UPX compressed |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
